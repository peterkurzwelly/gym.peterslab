<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0a0a0c" />
    <meta name="color-scheme" content="dark" />
    <meta name="description" content="Training, fuel and progress in one place." />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Gym" />
    <meta name="format-detection" content="telephone=no" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/pwa-64x64.png" sizes="64x64" type="image/png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon-180x180.png" sizes="180x180" />
    <title>Workout OS</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script type="module">
      // Service worker: the app shell works offline. A new version installs in the background
      // (registerType autoUpdate) and the page reloads onto it only at an app open, before the first
      // tap, and never while a session is open (src/lib/updatePolicy.ts). Dexie is untouched by a reload.
      import { registerSW } from "virtual:pwa-register";
      import { createUpdatePolicy } from "/src/lib/updatePolicy.ts";

      const reload = () => {
        // Guard against a reload loop if something keeps failing.
        try {
          const last = Number(sessionStorage.getItem("sw-reload-at") || 0);
          if (Date.now() - last < 10_000) return;
          sessionStorage.setItem("sw-reload-at", String(Date.now()));
        } catch {}
        location.reload();
      };

      let registration = null;
      const policy = createUpdatePolicy({
        reload,
        update: () => registration?.update().catch(() => {}),
      });

      addEventListener("pointerdown", () => policy.touch(), { capture: true, passive: true });
      addEventListener("keydown", () => policy.touch(), { capture: true });

      // An old page lazily loading a chunk the new version removed: reload onto the new version.
      const staleChunk = (msg) => /dynamically imported module|Importing a module script failed|error loading dynamically/i.test(String(msg || ""));
      addEventListener("vite:preloadError", (e) => {
        e.preventDefault();
        reload();
      });
      addEventListener("error", (e) => {
        if (staleChunk(e.message || e.error?.message)) reload();
      });
      addEventListener("unhandledrejection", (e) => {
        if (staleChunk(e.reason?.message)) reload();
      });

      registerSW({
        immediate: true,
        // A new version is active. Reload now at an untouched app open, else at the next open after the session.
        onNeedReload: () => policy.needReload(),
        onRegisteredSW(_url, reg) {
          if (!reg) return;
          registration = reg;
          document.addEventListener("visibilitychange", () => {
            if (document.visibilityState === "hidden") policy.hidden();
            else policy.visible();
          });
        },
      });
    </script>
  </body>
</html>
